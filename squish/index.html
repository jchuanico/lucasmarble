<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squish Finder</title>
<meta name="description" content="A 6-question quiz for Squishmallows collectors and gift-shoppers: find the perfect Squishmallow for you or someone you love.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span>💗</span><span>⭐</span><span>💜</span><span>☁️</span><span>💛</span><span>💙</span><span>⭐</span><span>💗</span></div>

<header class="top">
  <button class="logo" id="homeBtn" aria-label="Go to start">🧸 Squish Finder</button>
  <div class="top-actions">
    <button class="chip" id="pollBtn">📊 Poll</button>
    <button class="chip" id="musicBtn" aria-pressed="false" title="Toggle happy music">🔇 Music</button>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer class="foot">
  <p id="disclosure"></p>
  <p>Made for Squishmallows collectors, teens, adults and gift-shoppers.</p>
  <p>Fan-made quiz. Not affiliated with or endorsed by Jazwares or Squishmallows. Illustrations are original fan art; bios are fan-written.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
